<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRIDE · Dashboard cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --black:#0D0D0D;--black-light:#252525;--gray-light:#F0F0F0;--white:#FFFFFF;
  --magenta:#FF0097;--magenta-dark:#C929AD;--magenta-pale:#F8EAF1;--magenta-light:#FFD6EE;--magenta-soft:#E1C0D5;
  --cyano:#00C2FF;--cyano-dark:#0077A8;--cyano-light:#98E6FF;
  --green:#86C056;--orange:#FB4502;--gray-mid:#8A8A8A;--gray-soft:#C9C9C9;--hair:#E3E3E3;--border:#DEDEDE;
  --success:#2E7D46;--danger:#C4173A;
  --bg:#F0F0F0;--surface:#FFFFFF;--text:#0D0D0D;--text-2:#252525;
  --radius:16px;--shadow:0 1px 2px rgba(13,13,13,.08);
  --font:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--cyano-dark);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 248px;max-width:100%;background:var(--black);color:var(--white);padding:28px 20px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;flex-direction:column;gap:10px;padding:0 12px}
.brand svg{height:22px;width:auto;align-self:flex-start}
.rule{height:2px;width:48px;background:linear-gradient(45deg,var(--magenta),var(--cyano))}
.client{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.side .eyebrow{color:var(--gray-soft)}
.client-name{font-size:18px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.client-sub{font-size:13px;color:var(--gray-soft)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--white);font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.nav button:hover{background:var(--black-light)}
.nav button[aria-current="page"]{background:var(--white);color:var(--black)}
.nav .count{font-size:12px;color:var(--gray-soft)}
.nav .grp{display:block;margin:18px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-soft)}
.subtabs{margin:-4px 0 24px}
.nav button[aria-current="page"] .count{color:var(--magenta-dark)}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid #3A3A3A;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--gray-soft)}
.side-foot a{color:var(--cyano)}
.main{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,48px) 64px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.head h1{margin:6px 0 0;font-size:clamp(26px,3.2vw,40px);line-height:1.08;font-weight:900;letter-spacing:.8px;text-transform:uppercase;max-width:900px}
.head .eyebrow{color:var(--magenta-dark)}
.head-meta{font-size:12px;color:var(--text-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--black);background:var(--white);color:var(--black);font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--black);color:var(--white)}
.btn.accent{background:var(--magenta);border-color:var(--magenta);color:var(--white)}
.block{display:flex;flex-direction:column;gap:12px}
.block-title{margin:0;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:999px;flex:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(var(--min,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:15px;line-height:1.3;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.card p{margin:0;font-size:15px;line-height:1.55}
.kpi .label{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.kpi .value{font-size:34px;font-weight:900;letter-spacing:.5px}
.kpi .note{font-size:13px;line-height:1.45;color:var(--text-2)}
.hero{position:relative;overflow:hidden;background:var(--black);color:var(--white);border-radius:var(--radius);padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:12px}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--cyano) 0%,var(--magenta) 55%,transparent 72%);opacity:.75;pointer-events:none}
.hero .eyebrow{color:var(--magenta);position:relative}
.hero .value{position:relative;font-size:clamp(52px,8vw,92px);line-height:1;font-weight:900}
.hero p{position:relative;margin:0;font-size:17px;line-height:1.6;max-width:640px}
.tone-positive{border-top:4px solid var(--green)}
.tone-negative{border-top:4px solid var(--orange)}
.tone-accent{background:var(--magenta-pale);border-color:transparent}
.cmp .row{display:flex;flex-direction:column;gap:6px}
.cmp .row-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.cmp .track{background:var(--gray-light);border-radius:999px;height:12px}
.cmp .bar{height:12px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--white);color:var(--black);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:var(--white)}
.filters{display:flex;flex-direction:column;gap:10px}
.filters .eyebrow{color:var(--text-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gray-light);color:var(--black)}
.f-part{display:flex;flex-direction:column;gap:4px}
.f-part .k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.f-part p{margin:0;font-size:14px;line-height:1.55}
.f-dato{background:var(--magenta-pale);border-radius:8px;padding:12px 14px}
.f-insight{padding:0 14px}.f-insight .k{color:var(--cyano-dark)}
.f-azione{border-top:1px solid var(--hair);padding:12px 14px 0}.f-azione .k{color:var(--magenta-dark)}
.f-azione p{font-weight:500}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
.scroll-x{overflow-x:auto}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:16px;min-width:min-content}
.lane{background:var(--hair);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.lane h3{margin:4px 6px 0;font-size:15px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.lane .focus{margin:0 6px;font-size:13px;color:var(--text-2)}
.lane .card{padding:16px;gap:8px}
.lane .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-2);border-top:1px solid var(--hair);padding-top:8px;flex-wrap:wrap}
.empty{font-size:14px;color:var(--text-2)}
.edit-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cyano-light);color:var(--black);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
[data-edit="1"] [data-path]{outline:1px dashed var(--cyano-dark);outline-offset:2px;border-radius:4px;cursor:text}
[data-edit="1"] [data-path]:focus{outline:2px solid var(--cyano-dark);background:#fff}
dialog{border:0;border-radius:16px;padding:24px;max-width:min(900px,92vw);width:100%;box-shadow:0 12px 32px rgba(13,13,13,.14)}
dialog::backdrop{background:rgba(13,13,13,.55)}
dialog textarea{width:100%;height:50vh;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--border);border-radius:8px;padding:12px}
.err{padding:24px;font-size:15px}
.gid{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-2)}
.card p.origine{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:4px}
.sel{align-self:flex-start;min-height:40px;padding:8px 36px 8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--white);font:600 13px var(--font);color:var(--black);max-width:100%}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{align-self:flex-start;border:0;background:none;padding:4px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cyano-dark);cursor:pointer;min-height:32px}
.tag.sprint{background:var(--black);color:var(--white)}
.tag.g-alta{background:#FF0000;color:var(--black)}.tag.g-media{background:#FF9900;color:var(--black)}.tag.g-bassa{background:#FFD966;color:var(--black)}.tag.g-opp{background:#0433FF;color:var(--white)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{padding:0;border:1px solid var(--border);border-radius:8px;background:var(--gray-light);cursor:zoom-in;overflow:hidden;width:96px;height:72px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .shot{margin:0;display:flex;flex-direction:column;gap:8px}
.gallery .shot button{padding:0;border:1px solid var(--border);border-radius:12px;background:var(--white);cursor:zoom-in;overflow:hidden}
.gallery .shot img{width:100%;height:auto;display:block}
.gallery figcaption{font-size:13px;color:var(--text-2);line-height:1.4}
.mx-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:880px;font-size:14px}
.mx th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 12px;border-bottom:1px solid var(--border);vertical-align:bottom}
.mx th.hl{background:var(--magenta-pale);color:var(--black)}
.mx td{padding:12px;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.45}
.mx tr:last-child td{border-bottom:0}
.mx td.area{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.mx td.tema{font-weight:600;min-width:200px}
.mx td.hl{background:var(--magenta-pale)}
.mx td.note{color:var(--text-2);font-size:13px;min-width:280px}
.rt{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--gray-light);color:var(--black)}
.rt.ok{background:#DDF0CF}.rt.medium{background:#FFF0C2}.rt.bad{background:#FFD9D9}.rt.nd{background:var(--gray-light)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--text-2);align-items:center}
.card p.detail{font-size:14px;color:var(--text-2);line-height:1.5}
.card p.competitor{font-size:13px;color:var(--text-2)}
.lead-note{margin:0;font-size:16px;font-weight:600}
/* viste del growth plan: distribuzioni, priorità per area, kanban */
.bd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 44px;gap:10px;align-items:center;width:100%;padding:4px 6px;border:0;border-radius:6px;background:transparent;text-align:left;font:inherit;font-size:13px;cursor:pointer}
.hbar:hover{background:var(--gray-light)}.hbar[aria-pressed="true"]{background:var(--magenta-pale)}
.hbar .tr{display:block;height:14px;border-radius:4px;background:var(--gray-light);overflow:hidden}.hbar .t{display:block;height:100%;background:var(--black)}.hbar .n{font-weight:700;text-align:right}
.hbar .k{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule-note{margin:0;font-size:12px;color:var(--text-2)}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.kb-col{background:var(--gray-light);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.kb-col h3{margin:0;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.kb-card{background:var(--white);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.kb-card h4{margin:0;font-size:13px;line-height:1.35}
.navg{display:none}
/* chat sui dati (prototipo, attiva con meta.chat): Claude con l'account di chi guarda, solo sui dati della pagina */
.chat-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;border:0;border-radius:999px;padding:12px 18px;background:var(--black);color:var(--white);font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.chat-fab[hidden],.chat-box[hidden]{display:none}
.chat-box{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;width:min(440px,calc(100vw - 24px));height:min(620px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--white);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden}
.chat-head{padding:14px 16px;background:var(--black);color:var(--white);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-head strong{font-size:14px}.chat-head button{background:transparent;border:0;color:var(--white);font-size:20px;cursor:pointer;line-height:1}
.chat-note{margin:0;padding:10px 16px;font-size:12px;color:var(--text-2);background:var(--gray-light)}
.chat-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:92%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-msg.u{align-self:flex-end;background:var(--black);color:var(--white)}
.chat-msg.a{align-self:flex-start;background:var(--gray-light)}
.chat-msg.s{align-self:flex-start;background:transparent;color:var(--text-2);font-size:12px;padding:0 2px}
.chat-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chat-sugg button{border:1px solid var(--gray-soft);background:var(--white);border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.chat-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--gray-light)}
.chat-form textarea{flex:1;resize:none;border:1px solid var(--gray-soft);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;min-height:40px;max-height:120px}
.chat-form button{border:0;border-radius:10px;padding:0 14px;background:var(--magenta);color:var(--white);font:inherit;font-weight:700;cursor:pointer}
.chat-form button.stop{background:var(--black-light)}
@media (max-width:820px){.chat-box{right:12px;left:12px;width:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px))}.chat-fab{right:12px}}

/* calendario (Roadmap test): solo le date scritte nel growth plan */
.cal{min-width:680px}
.cal-row{display:grid;grid-template-columns:minmax(170px,300px) 1fr;gap:14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--gray-light)}
.cal-row.head{border-bottom:0;padding-bottom:2px}
.cal-lab{font-size:13px;line-height:1.3;overflow:hidden}.cal-lab .gid{margin-right:6px}.cal-quando{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--text-2)}
.cal-track{position:relative;height:24px;border-radius:6px;background:var(--gray-light)}
.cal-row.head .cal-track{background:transparent;height:20px}
.cal-mlab{position:absolute;top:0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;padding-left:4px;border-left:1px solid var(--gray-soft)}
.cal-bar{position:absolute;top:4px;height:16px;border-radius:5px;min-width:6px}
.cal-dot{position:absolute;top:4px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--white)}
.cal-mese{position:absolute;top:4px;height:16px;border-radius:5px;border:2px dashed;background:transparent}
.cal-oggi{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--magenta);z-index:2}


.block>.chip{align-self:flex-start}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--gray-light);flex:1;min-width:160px}
.stack .seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.bar-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar-lab{flex:0 0 200px;font-size:13px;font-weight:600}
.pm{display:grid;grid-template-columns:160px repeat(3,minmax(110px,1fr));gap:6px;min-width:520px}
.pm-corner,.pm-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);display:flex;align-items:center;padding:6px}
.pm-cell{min-height:84px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit}
.pm-cell.qw{background:var(--magenta-pale);border-color:var(--magenta)}
.pm-cell[aria-pressed="true"]{outline:3px solid var(--black)}
.pm-n{font-size:28px;font-weight:900}.pm-q{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta-dark)}
#zoom{max-width:96vw;padding:12px}#zoom img{max-width:100%;max-height:82vh;display:block;margin:0 auto}
@media (max-width:820px){
  .bar-lab{flex-basis:100%}
  .pm{grid-template-columns:78px repeat(3,minmax(0,1fr));min-width:0;gap:4px}
  .pm-q{font-size:9px;letter-spacing:.02em}
  .pm-h,.pm-corner{font-size:10px;padding:4px}
  .pm-n{font-size:22px}
  .side{flex-basis:100%;padding:16px 16px 12px;gap:14px;position:sticky;top:0;z-index:10}
  .brand{flex-direction:row;align-items:center;justify-content:space-between;padding:0}
  .brand .rule{display:none}
  .client{padding:0;flex-direction:row;align-items:baseline;gap:10px;flex-wrap:wrap}
  .client .eyebrow,.client-sub,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid #3A3A3A}
  .nav .grp{display:none}
  .navg{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .navg::-webkit-scrollbar{display:none}
  .navg button{flex:none;min-height:34px;padding:6px 12px;border:0;border-radius:6px;background:transparent;color:var(--gray-soft);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .navg button[aria-current="true"]{background:var(--black-light);color:var(--white)}
  .nav .fuori-gruppo{display:none}
  .main{padding-top:20px}.kpi .value{font-size:28px}
  .mx td.area,.mx th.c-area{display:none}
  table.mx{min-width:680px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" aria-label="Sezioni">
    <div class="brand"><svg role="img" aria-label="IRIDE" id="Livello_2" data-name="Livello 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860.79 183.03" fill="#FFFFFF">
  <defs></defs>
  <g id="Livello_1-2" data-name="Livello 1">
    <g>
      <polygon class="cls-1" points="0 30.59 15.17 30.59 15.17 152.44 0 152.44 0 183.03 60.92 183.03 60.92 152.44 45.76 152.44 45.76 30.59 60.92 30.59 60.92 0 0 0 0 30.59"></polygon>

<script>

(function(){
  const FONTE_COLORS={Quantitativa:"#98E6FF",Euristica:"#FFD6EE",Heatmap:"#C9C9C9",Survey:"#86C056",Benchmark:"#E1C0D5",Test:"#F0F0F0"};
  const state={section:null,filters:{},edit:/[?&]edit=1/.test(location.search)};
  let DATA=null;

  function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function txt(tag,cls,value,path){const e=el(tag,cls,value);if(path)e.dataset.path=path;return e}
  function getAt(obj,path){return path.split(".").reduce((o,k)=>o==null?o:o[k],obj)}

  function num(v){const m=String(v).replace(/\./g,"").replace(",",".").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}

  function zoom(src){const d=document.getElementById("zoom");document.getElementById("zoom-img").src=src;d.showModal()}
  function thumbs(list){const w=el("div","thumbs");[].concat(list).forEach(src=>{const b=el("button","thumb");b.type="button";b.setAttribute("aria-label","Ingrandisci immagine");const i=el("img");i.src=src;i.alt="";i.loading="lazy";b.append(i);b.onclick=()=>zoom(src);w.append(b)});return w}
  const GRAV={"Alta":"g-alta","Media":"g-media","Bassa":"g-bassa","Opportunità mancata":"g-opp"};
  const STATO_COL={"TO DO":"#C9C9C9","WIP":"#FF9900","LIVE":"#00C2FF","DONE":"#86C056","DISCARDED":"#595959"};
  const STATO_TXT={"TO DO":"#0D0D0D","WIP":"#0D0D0D","LIVE":"#0D0D0D","DONE":"#0D0D0D","DISCARDED":"#FFFFFF"};
  const ESITO_COL={"Winner":"#86C056","Loser":"#FF6B6B","Neutro":"#C9C9C9","Non valido":"#FFD966"};
  const pagesOf=x=>{const out=[];let cur="",d=0;for(const ch of String(x||"")){if(ch==="(")d++;if(ch===")")d=Math.max(0,d-1);
    if((ch===","||ch==="+")&&d===0){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(v=>v.trim()).filter(Boolean)};  // divide solo fuori dalle parentesi
  const eur=v=>(v<0?"−":"")+"€ "+Math.abs(Math.round(v)).toLocaleString("it-IT");
  const pct=v=>Math.round(v*100)+"%";
  const fmtD=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v||"");return m?`${m[3]}/${m[2]}/${m[1]}`:(v||"")};
  const R={};

  R.hero=(b,p)=>{const h=el("section","hero");if(b.label)h.append(txt("span","eyebrow",b.label,p+".label"));

  R.cards=(b,p)=>{const g=el("div","grid");

  R.list=(b,p)=>{const c=el("div","card"+(b.tone?" tone-"+b.tone:""));

  R.images=(b,p)=>{const g=el("div","grid gallery");g.style.setProperty("--min","320px");
    b.items.forEach((it,i)=>{const f=el("figure","shot");const bt=el("button");bt.type="button";bt.setAttribute("aria-label","Ingrandisci immagine");const im=el("img");im.src=it.src;im.alt=it.caption||"";im.loading="lazy";bt.append(im);bt.onclick=()=>zoom(it.src);f.append(bt);
      if(it.caption)f.append(txt("figcaption",null,it.caption,`${p}.items.${i}.caption`));g.append(f)});return g};
  R.matrix=(b,p)=>{const wrap=el("div","block");const key=p;const f=state.filters[key]||(state.filters[key]={area:"Tutte"});
    const areas=["Tutte",...new Set(b.rows.map(r=>r.area).filter(Boolean))];
    if(areas.length>2){const box=el("div","f-part");box.append(el("span","eyebrow","Area"));const ch=el("div","chips");
      areas.forEach(a=>{const n=a==="Tutte"?b.rows.length:b.rows.filter(r=>r.area===a).length;const bt=el("button","chip",`${a} · ${n}`);bt.type="button";bt.setAttribute("aria-pressed",String(f.area===a));bt.onclick=()=>{f.area=a;render()};ch.append(bt)});box.append(ch);wrap.append(box)}
    const hasArea=b.rows.some(r=>r.area),hasTema=b.rows.some(r=>r.tema),hasNote=b.rows.some(r=>r.note);
    const mw=el("div","mx-wrap");const t=el("table","mx");const th=el("thead");const hr=el("tr");
    const L=b.labels||{};if(hasArea)hr.append(txt("th","c-area",L.area||"",`${p}.labels.area`));if(hasTema)hr.append(txt("th",null,L.tema||"",`${p}.labels.tema`));
    b.columns.forEach((c,i)=>{const h=txt("th",i===b.highlight?"hl":null,c,`${p}.columns.${i}`);h.scope="col";hr.append(h)});if(hasNote)hr.append(txt("th",null,L.note||"",`${p}.labels.note`));th.append(hr);t.append(th);
    const tb=el("tbody");b.rows.forEach((r,ri)=>{if(f.area!=="Tutte"&&r.area!==f.area)return;const q=`${p}.rows.${ri}`;const tr=el("tr");
      if(hasArea)tr.append(txt("td","area",r.area||"",q+".area"));if(hasTema){const td=txt("th","tema",r.tema||"",q+".tema");td.scope="row";td.style.cssText="position:static;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;border-bottom:1px solid var(--hair);vertical-align:top";tr.append(td)}
      r.values.forEach((v,i)=>{const td=el("td",i===b.highlight?"hl":null);const rt=(r.ratings||[])[i];if(v||rt){const pill=txt("span","rt "+(rt||""),v,`${q}.values.${i}`);td.append(pill)}tr.append(td)});
      if(hasNote)tr.append(txt("td","note",r.note||"",q+".note"));tb.append(tr)});t.append(tb);mw.append(t);wrap.append(mw);
    if(b.legend&&b.legend.length){const lg=el("div","legend");b.legend.forEach((l,i)=>{const it=el("span");it.append(txt("span","rt "+(l.rating||""),l.value,`${p}.legend.${i}.value`),document.createTextNode(" "),txt("span",null,l.text,`${p}.legend.${i}.text`));lg.append(it)});wrap.append(lg)}
    return wrap};
  // stato del piano (Panoramica): contato dalla pagina sulle celle del growth plan, si aggiorna a ogni aggiornamento
  R.plan_status=(b,p)=>{const w=el("div","block");const it=b.items;const conta=fn=>it.filter(fn).length;const qw=(b.regole||{}).quick_win;
    const isQw=x=>qw&&qw.effort.includes(x.effort)&&qw.impatto.includes(x.impatto);
    const aperti=it.filter(x=>x.sprint&&x.sprint!=="BACKLOG"&&x.status!=="DONE"&&x.status!=="DISCARDED");
    const sprint=[...new Set(aperti.map(x=>x.sprint))].sort((a,c)=>a.localeCompare(c,"it",{numeric:true}));
    const prossimo=sprint[0];
    const kpi=[["Interventi nel piano",it.length],["Quick win",conta(isQw)],["In corso",conta(x=>x.status==="WIP"||x.status==="LIVE")],["Fatti",conta(x=>x.status==="DONE")]];
    if(prossimo)kpi.push([prossimo+" · da fare",aperti.filter(x=>x.sprint===prossimo).length]);
    if(it.some(x=>x.esito))kpi.push(["Test conclusi",conta(x=>x.esito)]);
    w.append(el("h3",null,"Lo stato del piano"));
    const g=el("div","grid");g.style.setProperty("--min","150px");
    kpi.forEach(([l,v])=>{const c=el("div","card kpi");c.append(el("span","label",l),el("span","value",String(v)));g.append(c)});w.append(g);
    if(qw)w.append(el("p","rule-note",`Dal growth plan. Quick win: effort ${qw.effort.join(" o ")} e impatto ${qw.impatto.join(" o ")}; in corso: WIP e LIVE.`));
    return w};
  // calendario: date del growth plan (inizio e fine test, implementazione, mese previsto); nessuna data stimata
  R.calendar=(b,p)=>{const w=el("div","block");const it=b.items.filter(x=>x.stato!=="DISCARDED");const D=x=>new Date(x+"T00:00:00");
    const conData=it.filter(x=>x.inizio||x.fine||x.impl||x.mese);const senza=it.length-conData.length;
    const inizioMese=d=>new Date(d.getFullYear(),d.getMonth(),1),fineMese=d=>new Date(d.getFullYear(),d.getMonth()+1,0);
    const date=[];conData.forEach(x=>{["inizio","fine","impl"].forEach(k=>{if(x[k])date.push(D(x[k]))});if(x.mese){date.push(D(x.mese+"-01"))}});
    const oggi=new Date();oggi.setHours(0,0,0,0);date.push(oggi);
    let a=inizioMese(new Date(Math.min(...date))),z=fineMese(new Date(Math.max(...date)));
    while((z.getFullYear()-a.getFullYear())*12+z.getMonth()-a.getMonth()<3)z=fineMese(new Date(z.getFullYear(),z.getMonth()+1,1));
    const tot=(z-a)/864e5+1;const pos=d=>Math.max(0,Math.min(100,((d-a)/864e5)/tot*100));
    const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
    const sum=el("p","lead-note",`${conData.length} interventi con una data nel growth plan`+(senza?` · ${senza} ancora senza data (li trovi nella scheda Roadmap test, per sprint)`:""));w.append(sum);
    if(!conData.length){w.append(el("p","rule-note","Il calendario si riempie quando nel growth plan sono compilate le colonne DATA INIZIO TEST, DATA FINE TEST, DATE IMPLEMENTAZIONE o MESE."));return w}
    const cal=el("div","cal");const head=el("div","cal-row head");head.append(el("span"));const ht=el("div","cal-track");
    for(let m=new Date(a);m<=z;m=new Date(m.getFullYear(),m.getMonth()+1,1)){const l=el("span","cal-mlab",`${MESI[m.getMonth()]} ${m.getFullYear()}`);l.style.left=pos(m)+"%";ht.append(l)}
    head.append(ht);cal.append(head);
    const chiave=x=>x.inizio||x.impl||x.fine||(x.mese+"-01");
    conData.sort((x,y)=>chiave(x).localeCompare(chiave(y))).forEach(x=>{const r=el("div","cal-row");const lab=el("div","cal-lab");lab.append(el("span","gid","#"+x.growth_id),document.createTextNode(x.title||""));
      const it_=d=>d.split("-").reverse().join("/");const quando=[];
      if(x.inizio&&x.fine)quando.push(`Test dal ${it_(x.inizio)} al ${it_(x.fine)}`);else{if(x.inizio)quando.push(`Inizio test: ${it_(x.inizio)}`);if(x.fine)quando.push(`Fine test: ${it_(x.fine)}`)}
      if(x.impl)quando.push(`Implementazione: ${it_(x.impl)}`);
      if(x.mese&&!quando.length){const m=D(x.mese+"-01");quando.push(`Previsto: ${["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"][m.getMonth()]} ${m.getFullYear()}`)}
      lab.append(el("span","cal-quando",quando.join(" · ")));
      lab.title=[x.pagina,x.tipo,x.stato,x.sprint].filter(Boolean).join(" · ");r.append(lab);

      else{[["inizio","Inizio test"],["fine","Fine test"],["impl","Implementazione"]].forEach(([k,t])=>{if(x[k]){const d=el("div","cal-dot");d.style.left=pos(D(x[k]))+"%";d.style.background=col;d.title=`${t}: ${x[k].split("-").reverse().join("/")}`;tr.append(d)}})}
      if(x.mese&&!x.inizio&&!x.fine&&!x.impl){const m=D(x.mese+"-01");const f=el("div","cal-mese");f.style.left=pos(m)+"%";f.style.width=(pos(fineMese(m))-pos(m)+100/tot)+"%";f.style.borderColor=col;f.title=`Previsto nel mese di ${MESI[m.getMonth()]} ${m.getFullYear()}`;tr.append(f)}
      if(oggi>=a&&oggi<=z){const o=el("div","cal-oggi");o.style.left=pos(oggi)+"%";o.title="Oggi";tr.append(o)}
      r.append(tr);cal.append(r)});
    const sc=el("div","scroll-x");sc.append(cal);w.append(sc);
    const lg=el("div","legend");[["TO DO","Previsto"],["WIP","In lavorazione"],["LIVE","Test online"],["DONE","Concluso"]].forEach(([st,t])=>{const sp=el("span");const d=el("span","rt",t);d.style.background=STATO_COL[st]||"#ccc";d.style.color=STATO_TXT[st]||"#0D0D0D";sp.append(d);lg.append(sp)});w.append(lg);

  // ---------- chat sui dati (prototipo): sample = Claude con l'account di chi guarda; risponde solo dai dati della pagina ----------
  async function avviaChat(){
    if(!DATA.meta||!DATA.meta.chat)return;
    // prototipo: il pulsante compare sempre; se la chat non può funzionare, dice perché
    const diagnosi=motivo=>{const f=el("button","chat-fab","Chiedi ai dati");f.type="button";f.style.opacity=".6";const b=el("div","chat-box");b.hidden=true;b.style.height="auto";const h=el("div","chat-head");h.append(el("strong",null,"Chat sui dati non disponibile"));const c=el("button",null,"×");c.type="button";c.onclick=()=>{b.hidden=true};h.append(c);const t=el("p","chat-note","In questa vista la chat non può usare Claude. Motivo tecnico: "+motivo+". La dashboard resta consultabile come sempre.");t.style.background="transparent";t.style.fontSize="14px";t.style.padding="14px 16px";b.append(h,t);f.onclick=()=>{b.hidden=!b.hidden};document.body.append(b,f)};
    if(!window.claude||!window.claude.use){diagnosi("la pagina non è aperta dentro Claude (window.claude assente)");return}
    let sample=null;try{sample=await window.claude.use("sample")}catch(e){sample=null}
    if(!sample){diagnosi("Claude non rende disponibile la funzione «sample» per questa pagina e questo account");return}
    const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const sezione=id=>DATA.sections.find(s=>s.id===id);
    const blocchi=(id,tipo)=>((sezione(id)||{}).blocks||[]).filter(b=>b.type===tipo);
    const V=(blocchi("opportunita","breakdown")[0]||{}).items||[];
    const GPI={};blocchi("growth-plan","findings").forEach(b=>b.items.forEach(x=>{GPI[String(x.growth_id)]=x}));
    const CAL={};((blocchi("calendario","calendar")[0]||{}).items||[]).forEach(x=>{CAL[String(x.growth_id)]=x});
    const breve=x=>({id:"#"+x.id,titolo:x.title,pagina:x.pagina,stato:x.status||"TO DO",sprint:x.sprint,tipo_azione:x.tipo,priorita_iride:x.priorita,esito:x.esito});
    const filtra=a=>V.filter(x=>(!a.pagina||norm(x.pagina).includes(norm(a.pagina)))&&(!a.stato||norm(x.status||"TO DO")===norm(a.stato))&&(!a.sprint||norm(x.sprint).includes(norm(a.sprint)))&&(!a.tipo||norm(x.tipo).includes(norm(a.tipo)))&&(!a.fonte||norm(x.fonte).includes(norm(a.fonte)))&&(!a.testo||norm([x.title,(GPI[String(x.id)]||{}).insight,(GPI[String(x.id)]||{}).azione].join(" ")).includes(norm(a.testo))));
    let stato=null;
    const tools=[
      {name:"cerca_interventi",description:"Cerca gli interventi del growth plan. Filtri facoltativi: testo (parole nel titolo, insight o azione), pagina, stato (TO DO, WIP, LIVE, DONE, DISCARDED), sprint, tipo (tipo di azione), fonte. Restituisce al massimo 25 righe brevi (id, titolo, pagina, stato, sprint, tipo, priorità) e il totale trovato.",
       inputSchema:{type:"object",properties:{testo:{type:"string"},pagina:{type:"string"},stato:{type:"string"},sprint:{type:"string"},tipo:{type:"string"},fonte:{type:"string"}}},
       execute:a=>{stato&&(stato.textContent="Cerco tra gli interventi…");const r=filtra(a||{});return{totale:r.length,righe:r.slice(0,25).map(breve)}}},
      {name:"leggi_intervento",description:"Legge tutta la riga di un intervento del growth plan dato l'ID (es. 29 o 50b): insight, azione, idee di test, KPI, fonti, stato, sprint, date, esito.",
       inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},

  R.findings=(b,p,bi)=>{const wrap=el("div","block");const key=p;const f=state.filters[key]||(state.filters[key]={fonte:"Tutte",pagina:"Tutte",sprint:"Tutte",gravita:"Tutte",funnel:"Tutte"});
    const fontiDi=x=>x.fonti&&x.fonti.length?x.fonti:[x.fonte];const fonti=["Tutte",...new Set(b.items.flatMap(fontiDi))];const pagine=["Tutte",...new Set(b.items.flatMap(x=>pagesOf(x.pagina)))];
    const fl=el("div","filters");
    const mk=(label,opts,k)=>{if(opts.length<3)return;const box=el("div","f-part");box.append(el("span","eyebrow",label));
      if(opts.length>9){const sel=el("select","sel");sel.setAttribute("aria-label",label);opts.forEach(o=>{const n=o==="Tutte"?b.items.length:b.items.filter(x=>k==="pagina"?pagesOf(x.pagina).includes(o):k==="fonte"?fontiDi(x).includes(o):x[k]===o).length;const op=el("option",null,`${o} · ${n}`);op.value=o;if(f[k]===o)op.selected=true;sel.append(op)});
        sel.onchange=()=>{f[k]=sel.value;render()};box.append(sel);fl.append(box);return}
      const ch=el("div","chips");
      opts.forEach(o=>{const n=o==="Tutte"?b.items.length:b.items.filter(x=>k==="pagina"?pagesOf(x.pagina).includes(o):k==="fonte"?fontiDi(x).includes(o):x[k]===o).length;const bt=el("button","chip",`${o} · ${n}`);bt.type="button";
        bt.setAttribute("aria-pressed",String(f[k]===o));bt.onclick=()=>{f[k]=o;render()};ch.append(bt)});box.append(ch);fl.append(box)};
    mk("Fonte",fonti,"fonte");mk("Pagina",pagine,"pagina");mk("Funnel",["Tutte",...new Set(b.items.map(x=>x.funnel).filter(Boolean))],"funnel");mk("Pianificazione",["Tutte",...[...new Set(b.items.map(x=>x.sprint).filter(Boolean))].sort((a,c)=>(/backlog/i.test(a)-/backlog/i.test(c))||a.localeCompare(c,"it",{numeric:true}))],"sprint");mk("Gravità",["Tutte",...["Alta","Media","Bassa","Opportunità mancata","Dati insufficienti"].filter(g=>b.items.some(x=>x.gravita===g))],"gravita");if(fl.childNodes.length)wrap.append(fl);
    const g=el("div","grid");g.style.setProperty("--min","320px");g.style.alignItems="start";
    b.items.forEach((it,i)=>{if(f.fonte!=="Tutte"&&!fontiDi(it).includes(f.fonte))return;if(f.pagina!=="Tutte"&&!pagesOf(it.pagina).includes(f.pagina))return;if(f.funnel!=="Tutte"&&it.funnel!==f.funnel)return;if(f.sprint!=="Tutte"&&it.sprint!==f.sprint)return;if(f.gravita!=="Tutte"&&it.gravita!==f.gravita)return;
      const q=`${p}.items.${i}`;const c=el("article","card");const tg=el("div","tags");
      if(it.growth_id!=null)tg.append(el("span","gid","#"+it.growth_id));if(it.finding_id)tg.append(el("span","gid",it.finding_id));fontiDi(it).forEach(fn=>{const t1=el("span","tag",fn);t1.style.background=FONTE_COLORS[fn]||"#F0F0F0";tg.append(t1)});if(it.pagina)tg.append(txt("span","tag",it.pagina,q+".pagina"));if(it.variante)tg.append(txt("span","tag",it.variante,q+".variante"));
      if(it.sprint){const sp=txt("span","tag sprint",it.sprint,q+".sprint");tg.append(sp)}if(it.gravita)tg.append(txt("span","tag "+(GRAV[it.gravita]||""),it.gravita,q+".gravita"));if(it.tipo){const tt=txt("span","tag",it.tipo,q+".tipo");if(it.tipo==="Da approfondire"){tt.style.background="#0D0D0D";tt.style.color="#FFFFFF"}tg.append(tt)}if(it.area)tg.append(txt("span","tag",it.area,q+".area"));if(it.stato){const s=txt("span","tag",it.stato,q+".stato");s.style.background=STATO_COL[it.stato]||"#86C056";s.style.color=STATO_TXT[it.stato]||"#0D0D0D";tg.append(s)}
      c.append(tg);if(it.title)c.append(txt("h3",null,it.title,q+".title"));
      [["dato","Dato","f-dato"],["insight","Insight","f-insight"],["azione","Azione","f-azione"],["idee","Idee di test","f-azione"]].forEach(([k,lab,cls])=>{if(!it[k])return;
        const d=el("div","f-part "+cls);const tp=txt("p",null,it[k],`${q}.${k}`);d.append(el("span","k",lab),tp);
        if(!state.edit&&it[k].length>420){tp.classList.add("clamp");const mb=el("button","more","Leggi tutto");mb.type="button";mb.setAttribute("aria-expanded","false");
          mb.onclick=()=>{const o=tp.classList.toggle("clamp");mb.textContent=o?"Leggi tutto":"Riduci";mb.setAttribute("aria-expanded",String(!o))};d.append(mb)}c.append(d)});
      if(it.competitor){const cp=el("p","competitor");cp.append(el("strong",null,"Competitor: "),txt("span",null,it.competitor,q+".competitor"));c.append(cp)}if(it.kpi){const kp=el("p","competitor");kp.append(el("strong",null,"KPI: "),txt("span",null,it.kpi,q+".kpi"));c.append(kp)}if(it.img)c.append(thumbs(it.img));if(it.origine)c.append(txt("p","origine",it.origine,q+".origine"));g.append(c)});
    if(!g.childNodes.length)g.append(el("p","empty","Nessun elemento con questi filtri."));wrap.append(g);return wrap};

  function render(){
    const secs=DATA.sections;const cur=secs.find(s=>s.id===state.section)||secs[0];state.section=cur.id;
    document.title=`${DATA.meta.cliente} · IRIDE`;
    document.getElementById("client-name").textContent=DATA.meta.cliente;
    document.getElementById("client-sub").textContent=[DATA.meta.titolo,DATA.meta.periodo].filter(Boolean).join(" · ");
    const nav=document.getElementById("nav");nav.replaceChildren();
    // menu a gruppi (Panoramica, Il piano, Le analisi, Prossimi passi); le schede di una sezione stanno dentro la madre
    const vai=id=>{state.section=id;render();if(!state.edit){try{history.replaceState(null,"","#"+id)}catch(e){}}document.getElementById("main").focus({preventScroll:true});window.scrollTo(0,0)};
    const madre=cur.dentro?(secs.find(s=>s.id===cur.dentro)||cur):cur;const figlie=secs.filter(s=>s.dentro===madre.id);
    const conta=s=>s.blocks.filter(x=>x.type==="findings").reduce((a,x)=>a+x.items.length,0);
    let gruppo=null;const gCur=madre.gruppo||"";
    const navg=document.getElementById("navg");navg.replaceChildren();const visti=[];
    secs.filter(s=>!s.dentro).forEach(s=>{const g=s.gruppo||"";if(visti.includes(g))return;visti.push(g);
      const b=el("button",null,g||s.nav);b.type="button";b.setAttribute("aria-current",String(g===gCur));b.onclick=()=>vai(s.id);navg.append(b)});
    secs.filter(s=>!s.dentro).forEach(s=>{if(s.gruppo&&s.gruppo!==gruppo){gruppo=s.gruppo;nav.append(el("span","grp",gruppo))}
      const b=el("button",(s.gruppo||"")!==gCur?"fuori-gruppo":null);b.type="button";b.append(el("span",null,s.nav));
      const n=conta(s)+secs.filter(f=>f.dentro===s.id).reduce((a,f)=>a+conta(f),0);if(n)b.append(el("span","count",String(n)));
      if(s.id===madre.id){b.setAttribute("aria-current","page");requestAnimationFrame(()=>b.scrollIntoView({block:"nearest",inline:"center"}))}b.onclick=()=>vai(s.id);nav.append(b)});
    const foot=document.getElementById("side-foot");foot.replaceChildren();
    if(DATA.meta.contatto){foot.append(el("span","eyebrow","Il tuo Team Leader IRIDE"),el("span",null,DATA.meta.contatto.nome||""));
      if(DATA.meta.contatto.email){const a=el("a",null,"Scrivici");a.href="mailto:"+DATA.meta.contatto.email;foot.append(a)}}
    const main=document.getElementById("main");main.replaceChildren();
    if(state.edit){const bar=el("div","edit-bar");bar.append(el("span",null,"Modalità modifica: clicca un testo per cambiarlo."));
      const ex=el("button","btn primary","Esporta dati");ex.type="button";ex.onclick=openExport;bar.append(ex);main.append(bar)}
    const si=secs.indexOf(cur);const head=el("header","head");const hl=el("div");
    hl.append(el("span","eyebrow",madre.nav));if(cur.title)hl.append(txt("h1",null,cur.title,`sections.${si}.title`));
    const hm=el("div","head-meta");if(DATA.meta.aggiornato_il)hm.append(el("span",null,"Rilasciata il "+fmtDate(DATA.meta.aggiornato_il)));
    head.append(hl,hm);main.append(head);
    if(figlie.length){const tabs=el("div","chips subtabs");tabs.setAttribute("role","tablist");tabs.setAttribute("aria-label",madre.nav);
      [madre,...figlie].forEach(s=>{const t=el("button","chip",s.nav);t.type="button";t.setAttribute("role","tab");t.setAttribute("aria-pressed",String(s.id===cur.id));t.setAttribute("aria-selected",String(s.id===cur.id));t.onclick=()=>vai(s.id);tabs.append(t)});main.append(tabs)}
    cur.blocks.forEach((b,bi)=>{const p=`sections.${si}.blocks.${bi}`;const sec=el("section","block");
      if(b.title){const h=txt("h2","block-title",b.title,p+".title");if(b.tone==="positive"||b.tone==="negative"){const d=el("span","dot");d.style.background=b.tone==="positive"?"var(--green)":"var(--orange)";h.prepend(d)}sec.append(h)}
      const fn=R[b.type];sec.append(fn?fn(b,p,bi):el("p","empty","Blocco non riconosciuto: "+b.type));main.append(sec)});
    if(state.edit)main.querySelectorAll("[data-path]").forEach(n=>{n.contentEditable="true";n.addEventListener("blur",()=>{setAt(DATA,n.dataset.path,n.textContent.trim())})});
  }
  function fmtDate(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})}
  function openExport(){const out=JSON.parse(JSON.stringify(DATA));const d=document.getElementById("export");document.getElementById("export-text").value=JSON.stringify(out,null,2);d.showModal()}
  document.getElementById("zoom-close").onclick=()=>document.getElementById("zoom").close();
  document.getElementById("export-close").onclick=()=>document.getElementById("export").close();
  document.getElementById("export-dl").onclick=()=>{const blob=new Blob([document.getElementById("export-text").value],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dashboard.json";a.click()};
  if(state.edit)document.getElementById("app").dataset.edit="1";

  function start(d){DATA=d;let h="";try{h=location.hash.replace("#","")}catch(e){}if(h)state.section=h;render();avviaChat();window.addEventListener("hashchange",()=>{const k=location.hash.replace("#","");if(k&&k!==state.section){state.section=k;render();window.scrollTo(0,0)}})}
  // dati cifrati (hosting pubblico, es. GitHub Pages): si chiede la password e si decifra nel browser (AES-GCM, PBKDF2-SHA256)
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function decifra(enc,pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},k,b64(enc.dati));return JSON.parse(new TextDecoder().decode(pt))}
  function chiediPassword(enc){const main=document.getElementById("main");const box=el("form","card");box.style.maxWidth="420px";box.style.margin="10vh auto";
    box.append(el("h1",null,"Dashboard riservata"),el("p",null,"Inserisci la password che ti ha dato il team IRIDE."));
    const inp=document.createElement("input");inp.type="password";inp.autocomplete="current-password";inp.setAttribute("aria-label","Password");inp.style.cssText="width:100%;padding:10px;border:1px solid var(--gray-soft);border-radius:8px;font:inherit;margin:8px 0";
    const bt=el("button","chip","Apri");bt.type="submit";const err=el("p","err","");box.append(inp,bt,err);main.append(box);inp.focus();
    box.onsubmit=async e=>{e.preventDefault();bt.disabled=true;err.textContent="";try{const d=await decifra(enc,inp.value);box.remove();start(d)}catch(x){err.textContent="Password non corretta.";bt.disabled=false;inp.select()}}}
  if(window.DASHBOARD_DATA)start(window.DASHBOARD_DATA);
  else fetch("dashboard.enc.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(chiediPassword)
    .catch(()=>fetch("dashboard.json",{cache:"no-store"}).then(r=>r.json()).then(start).catch(()=>{document.getElementById("main").append(el("p","err","Non riesco a caricare i dati della dashboard."))}));
})();
